# Flutter gen-l10n: the app's French and English texts.
# Edit lib/l10n/app_en.arb (the template) and lib/l10n/app_fr.arb, then run
# `flutter gen-l10n` (or `flutter pub get`): it rewrites lib/l10n/app_localizations*.dart,
# which are committed. See docs/contributing.md › Translations.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# AppLocalizations.of(context) is never null: every MaterialApp of the app (and
# of the widget tests, see test/helpers/localized_app.dart) has the delegates.
nullable-getter: false
# French first: the language when the device's is neither French nor English.
preferred-supported-locales: [fr]
format: true
