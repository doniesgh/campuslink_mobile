name: campuspulse
description: CampusPulse - community platform for campus life.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The version flutter_localizations pins (dates and plurals of the FR/EN texts).
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  file_picker: ^11.0.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  # Opens the Google Meet link of an online class.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the ARB files (see l10n.yaml
  # and docs/contributing.md › Translations) on `flutter pub get` and builds.
  generate: true
  assets:
    - assets/images/
