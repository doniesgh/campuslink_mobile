# Render Blueprint: the CampusPulse API on Render's free plan.
# Render > New > Blueprint > this repository. See docs/deploy.md.
#
# Secrets are never in this file:
# - JWT_ACCESS_SECRET is generated by Render.
# - MONGO_URL (MongoDB Atlas), the SMTP_* values and the OPENROUTER_* ones are
#   asked for when the Blueprint is created (sync: false).
# - The Firebase key is a Render "Secret File" named firebase-service-account.json
#   (Environment > Secret Files), read from /etc/secrets/.
services:
  - type: web
    name: campuspulse-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # NODE_ENV=production makes `npm ci` skip the dev dependencies, but the
    # build needs them (TypeScript and the @types packages): install them for
    # the build, then remove them so the running API only has what it needs.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render routes traffic to 0.0.0.0:$PORT (PORT is set by Render).
      - key: HOST
        value: 0.0.0.0
      # One proxy (Render's) in front of the API: the real client IP comes
      # from X-Forwarded-For, for the rate limits and the audit log.
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: FIREBASE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/firebase-service-account.json
      # Optional: real emails for the password-reset codes. Without them, the
      # codes are only printed in Render's logs.
      # Free web services can't use SMTP ports 25, 465 and 587, so Gmail goes
      # through a Google Apps Script relay over HTTPS (backend/mail-relay/,
      # see docs/deploy.md). It takes precedence over SMTP.
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      # Or SMTP on a port the free plan allows, e.g. Brevo on 2525.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # "CampusPulse <address>": the sender name (relay) or address (SMTP).
      - key: SMTP_FROM
        sync: false
      # Optional: AI features through OpenRouter. Without a key, AI is off and
      # the app works without it. OPENROUTER_MODEL empty = the free models;
      # they need OPENROUTER_ALLOW_DATA_COLLECTION=true (see .env.example).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_ALLOW_DATA_COLLECTION
        sync: false
