# Render Blueprint: the CampusPulse API on Render's free plan.
# Render > New > Blueprint > this repository. See docs/deploy.md.
#
# Secrets are never in this file:
# - JWT_ACCESS_SECRET is generated by Render.
# - MONGO_URL (MongoDB Atlas) and the SMTP_* values are asked for when the
#   Blueprint is created (sync: false).
# - The Firebase key is a Render "Secret File" named firebase-service-account.json
#   (Environment > Secret Files), read from /etc/secrets/.
services:
  - type: web
    name: campuspulse-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # NODE_ENV=production makes `npm ci` skip the dev dependencies, but the
    # build needs them (TypeScript and the @types packages): install them for
    # the build, then remove them so the running API only has what it needs.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render routes traffic to 0.0.0.0:$PORT (PORT is set by Render).
      - key: HOST
        value: 0.0.0.0
      # One proxy (Render's) in front of the API: the real client IP comes
      # from X-Forwarded-For, for the rate limits and the audit log.
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: FIREBASE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/firebase-service-account.json
      # Optional: real emails for sign-up codes and password resets. Without
      # SMTP_HOST, the codes are only printed in Render's logs.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
